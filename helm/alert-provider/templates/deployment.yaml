# krateo-alert-provider — the HyperDX-alert → Incident handler. Its reconciler mirrors each
# Alert's HyperDX state every pass; a firing counts on the open incident the comparison model
# (config.compareModelConfig) names as its cause, or opens an Incident CR
# (incident-controller's CRD) whose RCA the RCA agent (config.autopilotA2aUrl, incident-agent by
# default) writes. HyperDX's webhook posts to
# http://krateo-alert-provider.krateo-system.svc:8080/webhook, which only acknowledges. Image is
# tag-driven (values.image.tag = chart appVersion), multi-arch (linux/amd64 + linux/arm64). Bump
# this version tag alongside any code change that needs to reach the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: krateo-alert-provider
  namespace: krateo-system
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: krateo-alert-provider
  namespace: krateo-system
rules:
  # the handler opens Incidents for firing alerts, counts firings and writes the RCA
  - apiGroups: ["observability.krateo.io"]
    resources: ["incidents", "incidents/status"]
    verbs: ["create", "get", "list", "patch", "update"]
  # the reconciler reads Alert CRs (desired), seeds defaults, and writes their status
  - apiGroups: ["observability.krateo.io"]
    resources: ["alerts", "alerts/status"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  # the key-bootstrap Job (same SA) writes the hyperdx-api-token Secret; the comparison reads a
  # ModelConfig's apiKeySecret
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "patch", "update"]
  # the comparison resolves its model from config.compareModelConfig
  - apiGroups: ["kagent.dev"]
    resources: ["modelconfigs"]
    verbs: ["get"]
  # provider-runtime records Events on the Alerts it reconciles
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: krateo-alert-provider
  namespace: krateo-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: krateo-alert-provider
subjects:
  - kind: ServiceAccount
    name: krateo-alert-provider
    namespace: krateo-system
---
# The cluster-wide READ of the analyzer identity, group krateo:alert-provider: the RCA's k8s
# tool calls. The namespaced Role above covers the pod's own writes (incidents, alerts, the
# hyperdx-token Secret).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: krateo-alert-provider-observer
rules:
  # CLUSTER-WIDE READ. The RCA is asked to explain arbitrary cluster failures, so it must be able to
  # READ arbitrary cluster objects. Without this it could read nothing but its own CRDs, and every
  # k8s tool call in an analysis came back Forbidden — on krateo-057 three separate reports recorded
  # it in status.missingContext ("User krateo-alert-troubleshooter cannot get/list ..."), and the
  # analysis silently fell back to ClickHouse logs alone while still publishing 0.95-0.98 confidence.
  # An RCA that never read a live object is indistinguishable from a grounded one unless you open
  # that field, which is the worst property a diagnostic can have.
  #
  # This is READ-ONLY and deliberate. It does NOT restore the old confused deputy: that was
  # `kagent-tools` bound to apiGroups/resources/verbs ALL — full WRITE as a shared, user-facing
  # identity. That binding was removed when tool calls moved to the caller's identity via the
  # agentgateway cert-replay hop, and nothing here brings it back. This grants get/list/watch to ONE
  # non-user-facing analyzer.
  #
  # It does include secrets cluster-wide, which is the honest cost of "read everything". The
  # mitigating control is on the LLM path, not here: the agentgateway promptGuard masks key material
  # and connection strings before anything reaches a model. The subject below is this one
  # non-user-facing analyzer.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: krateo-alert-provider-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: krateo-alert-provider-observer
subjects:
  # The RCA's k8s tool calls, which do NOT arrive as this ServiceAccount. incident-agent runs them
  # through the agentgateway cert-replay hop: it swaps the caller's authn JWT for the client cert in
  # <user>-clientconfig, so the apiserver sees that cert's CN as the User and its O= entries as Groups.
  # The cert carries O=krateo:alert-provider (serviceaccount-authn.yaml spec.groups), never
  # system:serviceaccount:..., so only a Group subject authorizes the read granted above.
  - kind: Group
    name: krateo:alert-provider
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: krateo-alert-provider
  namespace: krateo-system
  labels: { app: krateo-alert-provider }
spec:
  replicas: 1
  selector:
    matchLabels: { app: krateo-alert-provider }
  template:
    metadata:
      labels: { app: krateo-alert-provider }
    spec:
      serviceAccountName: krateo-alert-provider
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: tmp
          emptyDir: {}
        # Intra-service auth (Option A): an audience-bound projected SA token the handler exchanges at
        # authn for a service JWT. Harmless when config.authnUrl is unset (the handler never reads it).
        - name: authn-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: authn
                  expirationSeconds: 600
                  path: token
      containers:
        - name: handler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          ports:
            - containerPort: 8080
          env:
            # All runtime config is overridable via values.config.* (installer:
            # componentValues.alert-provider.config.*); defaults live in values.yaml and match the
            # in-cluster krateo-system layout. NAMESPACE is the release namespace (its Alerts and Incidents).
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: AUTOPILOT_A2A_URL
              value: {{ .Values.config.autopilotA2aUrl | quote }}
            # The agent that judges whether a firing is the problem an open incident describes.
            - name: COMPARE_MODEL_CONFIG
              value: {{ .Values.config.compareModelConfig | quote }}
            - name: MAX_COMPARE_CANDIDATES
              value: {{ .Values.config.maxCompareCandidates | quote }}
            - name: FAILED_ANALYSIS_HOLD
              value: {{ .Values.config.failedAnalysisHold | quote }}
            # Intra-service auth (Option A): when set, the handler exchanges the projected SA token
            # (audience "authn", mounted below) at <authnUrl>/serviceaccount/login for a Krateo JWT and
            # presents it on the A2A calls (the RCA and the comparisons), so the gated agents accept them.
            # Empty (default) = unauthenticated A2A, exactly as before (older clusters with no gateway).
            - name: AUTHN_URL
              value: {{ .Values.config.authnUrl | quote }}
            # --- reconciler (Alert CRs -> HyperDX v2 external API, Bearer auth) ---
            - name: HYPERDX_API_URL
              value: {{ .Values.config.hyperdxApiUrl | quote }}
            - name: HYPERDX_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: hyperdx-api-token, key: accessKey } }
            - name: RECONCILE_INTERVAL
              value: {{ .Values.config.reconcileInterval | quote }}
            # default Alert CRs seeded by the reconciler (not shipped as CRs — CRD-order safe).
            # `${NAMESPACE}` in a default alert's SQL `where` is substituted with the release namespace
            # here, so the platform-scoped defaults are portable across a non-default krateo namespace.
            - name: DEFAULT_ALERTS_JSON
              value: {{ .Values.config.defaultAlerts | toJson | replace "${NAMESPACE}" .Release.Namespace | quote }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true          # KSV-0014
            seccompProfile: { type: RuntimeDefault }  # KSV-0104
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp                       # only writable path a read-only-root app needs
            - name: authn-token                     # projected SA token (aud "authn") for intra-service auth
              mountPath: /var/run/secrets/authn
              readOnly: true
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: krateo-alert-provider
  namespace: krateo-system
spec:
  # Headless: this bench cluster's ClusterIP range is exhausted; a headless service still
  # resolves krateo-alert-provider.krateo-system.svc → the pod IP for HyperDX's webhook POST.
  clusterIP: None
  selector: { app: krateo-alert-provider }
  ports:
    - port: 8080
      targetPort: 8080
